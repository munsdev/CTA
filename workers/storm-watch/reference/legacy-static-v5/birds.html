      <div class="bird-info"><div class="bird-state">${b.state}</div><div class="bird-species">${b.bird}</div></div>
      <div class="bird-meta">
        <div class="power-tag" style="background:${c}18;border:1px solid ${c}55;color:${c}">${b.superName}</div>
        <div class="mig-tag">${MS[b.migration]||b.migration}</div>
      </div>
    </div>`;
  }).join('');
}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const r=document.getElementById('regionFilter').value;
  const h=document.getElementById('habitatFilter').value;
  const m=document.getElementById('migFilter').value;
  const p=document.getElementById('powerFilter').value;
  document.querySelectorAll('.filters select').forEach(s=>s.classList.toggle('active',!!s.value));
  filtered=birds.filter(b=>{
    if(q&&!b.state.toLowerCase().includes(q)&&!b.abbr.toLowerCase().includes(q)&&!b.bird.toLowerCase().includes(q)&&!b.superName.toLowerCase().includes(q))return false;
    if(r&&b.region!==r)return false;
    if(h&&b.habitat!==h)return false;
    if(m&&b.migration!==m)return false;
    if(p&&b.superName!==p)return false;
    return true;
  });
  render();
}
function openModal(abbr){
  const b=birds.find(x=>x.abbr===abbr);if(!b)return;
  const c=PC[b.superName]||'#c9960a';
  document.getElementById('modal').style.borderTop=`3px solid ${c}`;
  document.getElementById('mAbbr').style.cssText=`width:50px;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:.05em;background:${c}18;border:2px solid ${c};color:${c}`;
  document.getElementById('mAbbr').textContent=b.abbr;
  document.getElementById('mState').textContent=b.state.toUpperCase();
  document.getElementById('mSpecies').textContent=b.bird;
  document.getElementById('mRegion').textContent=b.region;document.getElementById('mRegion').style.color=c;
  document.getElementById('mHabitat').textContent=b.habitat;document.getElementById('mHabitat').style.color=c;
  document.getElementById('mMig').textContent=MS[b.migration]||b.migration;document.getElementById('mMig').style.color=c;
  document.getElementById('mPowerBlock').style.borderLeft=`4px solid ${c}`;
  document.getElementById('mPowerName').textContent='⚡ '+b.superName;document.getElementById('mPowerName').style.color=c;
  document.getElementById('mPowerDesc').textContent=b.superDesc;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('search').addEventListener('input',applyFilters);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal({target:document.getElementById('overlay')})});
render();
</script>
</body>
</html>
