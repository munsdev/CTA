name = "abuela-terminal"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Abuela — the Hacker's monitoring console, as a browser app.
#
# Standalone: this Worker serves the whole page (a full-screen ops console),
# not an embeddable engine like the games under /games. The console is the
# product, so it owns its own URL rather than living inside a Webflow shell.
#
# Static files (index.html, app.js, styles.css, admin.html) live in ./public.
# run_worker_first sends every request through src/index.js so the API routes
# and the R2-backed /paper/* route are matched before the asset layer can
# claim them — same reason Ice Blaster sets it.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Content + player state. Commands, responses, the flag ladder, the authored
# ledger spine, the glossary, session rows, and the miss log all live here.
# Editing content means editing rows (via /admin) and bumping
# content_meta.version — no redeploy.
[[d1_databases]]
binding = "ABUELA_DB"
database_name = "abuela-terminal-db"
database_id = "05addd84-8527-4533-b8ac-08444e370ecc"

# Paper. Everything in D1 is mutable and self-serving — it's what Abuela
# writes about itself. R2 holds scans of physical records: the registered-agent
# filing, a printed budget line, an invoice. Paper is the one medium the system
# cannot retroactively rewrite, which is exactly why the evidence lives in a
# different store than the machine's own account of itself.
[[r2_buckets]]
binding = "PAPER"
bucket_name = "abuela-terminal-assets"

# Rate-limit counters and the global LLM kill-switch. KV rather than D1 because
# these are hot-path writes on every generated response and none of it is
# content worth keeping.
[[kv_namespaces]]
binding = "LIMITS"
id = "b96b181785ec483a8abb3828df5f211d"

# Secrets — set in the Cloudflare dashboard (Workers & Pages > abuela-terminal
# > Settings > Variables and Secrets > Add), or via `wrangler secret put <NAME>`
# if you have wrangler authenticated locally:
#   ADMIN_TOKEN      bearer token for /api/admin/* and admin.html
#   ANTHROPIC_API_KEY  long-tail response generation (optional; the console
#                      runs without it — unmatched input just gets the flat
#                      rejection instead of a generated line)
